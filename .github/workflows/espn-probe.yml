name: ESPN probe
# Temporary: asks ESPN what it publishes and posts the answer on issue #40, because the
# development workspace cannot open espn.com. Delete this workflow once the table is built.
on:
  # workflow_dispatch is only registered from the default branch, so run on push instead.
  push:
    paths:
      - '.github/workflows/espn-probe.yml'
      - 'scripts/espn_probe.py'
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ask ESPN
        run: python3 scripts/espn_probe.py
        env:
          ISSUE_NUMBER: "40"
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
